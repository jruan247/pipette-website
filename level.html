<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移液器闯关 · 7 关</title>
<style>
  :root{
    --bg:#eef2f6; --panel:#fff; --ink:#12293d; --ink2:#3c5a75; --muted:#7c93a8;
    --line:#dbe4ee; --blue:#0f5c9c; --blue2:#1a7ec4; --blue050:#f2f8fd;
    --green:#15805a; --green2:#1f9e74; --amber:#b8720a; --red:#b23a2e;
    --yellow:#f2c211; --yellow2:#ffe680;
    --shadow:0 10px 30px rgba(18,42,66,.10);
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0;background:
      radial-gradient(1200px 600px at 15% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),
      radial-gradient(900px 500px at 100% 0%, #e6f1fb 0%, rgba(230,241,251,0) 55%),
      var(--bg);
    color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  .hidden{display:none !important;}
  .app{max-width:1440px;margin:0 auto;padding:24px 24px 34px;}
  .view{animation:fadeIn .28s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- 地图 ---------- */
  .map-hero{
    display:flex;justify-content:space-between;align-items:flex-end;gap:28px;
    background:
      linear-gradient(135deg,rgba(255,255,255,.92),rgba(246,251,255,.92)),
      linear-gradient(120deg,#eaf4ff,#f7fbff 45%,#eef8f3);
    border:1px solid var(--line);border-radius:26px;padding:30px 32px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .map-hero::after{
    content:"";position:absolute;right:-90px;top:-120px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(26,126,196,.13),rgba(26,126,196,0) 68%);
    pointer-events:none;
  }
  .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--blue2);font-weight:800;margin:0 0 4px;}
  .map-hero h1{font-size:38px;line-height:1.1;margin:0 0 8px;letter-spacing:-.02em;}
  .map-hero .sub{font-size:14px;color:var(--ink2);margin:0;max-width:640px;}
  .progress-box{min-width:300px;background:rgba(255,255,255,.78);border:1px solid #d9e7f2;border-radius:18px;padding:15px 17px;backdrop-filter:blur(6px);}
  .progress-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .progress-num{font-size:28px;font-weight:800;letter-spacing:-.03em;color:#0d3f66;font-variant-numeric:tabular-nums;}
  .progress-num span{font-size:14px;color:var(--muted);font-weight:600;}
  .progress-label{font-size:12px;color:var(--muted);margin-top:4px;}
  .progress-bar{height:9px;background:#dfe9f2;border-radius:99px;overflow:hidden;margin-top:10px;}
  #progressFill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue2),var(--green2));transition:width .45s ease;}

  .level-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px;}
  @media (max-width:1180px){.level-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media (max-width:860px){.level-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (max-width:560px){.level-grid{grid-template-columns:1fr;}}
  .level-card{
    position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:17px 18px 15px;min-height:172px;display:flex;flex-direction:column;gap:8px;
    cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    overflow:hidden;
  }
  .level-card:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(18,42,66,.10);border-color:#b9d7ec;}
  .level-card.current{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(26,126,196,.13),0 14px 28px rgba(18,42,66,.08);}
  .level-card.current::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--blue2),#61b7e6);}
  .level-card.cleared{border-color:#bfe3cf;background:linear-gradient(160deg,#ffffff,#f4fcf7);}
  .level-card.cleared::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--green2),#7bd3ad);}
  .level-card.locked{opacity:.56;cursor:not-allowed;background:#f7fafc;filter:saturate(.7);}
  .level-card.locked:hover{transform:none;box-shadow:none;border-color:var(--line);}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .num{font-size:12px;font-weight:800;letter-spacing:.08em;color:#8aa2b6;font-variant-numeric:tabular-nums;}
  .level-card.current .num{color:var(--blue2);}
  .level-card.cleared .num{color:var(--green);}
  .status{font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;background:#f1f6fa;color:#637f96;border:1px solid #dfe9f2;}
  .level-card.current .status{background:#eaf5ff;border-color:#c4e0f4;color:#0f5c9c;}
  .level-card.cleared .status{background:#e9f8f1;border-color:#c4e8d7;color:#14664b;}
  .level-card h3{font-size:19px;line-height:1.25;margin:0;letter-spacing:-.01em;}
  .level-card p{font-size:12.5px;color:#5f7a90;margin:0;line-height:1.55;min-height:38px;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px dashed #e6eef5;font-size:11px;color:#8aa2b6;}
  .card-foot .go{font-weight:800;color:var(--blue2);}
  .level-card.cleared .card-foot .go{color:var(--green);}
  .lock-dot{font-size:12px;color:#9aafbe;}
  .map-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;color:var(--muted);font-size:12px;}
  .link-btn{border:0;background:none;color:#7d95aa;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px;}
  .link-btn:hover{color:var(--red);}
  .all-clear{
    margin-top:14px;border:1px solid #bfe3cf;background:linear-gradient(135deg,#effcf5,#ffffff);
    color:#14664b;border-radius:16px;padding:13px 16px;font-size:13px;display:flex;gap:10px;align-items:center;
  }
  .all-clear b{font-size:15px;}

  /* ---------- 关卡页 ---------- */
  .level-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px;}
  .ghost-btn{border:1px solid #cfe0ee;background:#fff;color:#245072;border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .ghost-btn:hover{background:#f4faff;border-color:#a9d3ee;}
  .level-head-main{display:flex;align-items:baseline;gap:12px;}
  .level-kicker{font-size:10.5px;letter-spacing:.16em;color:var(--muted);font-weight:800;}
  .level-head h2{font-size:25px;margin:0;letter-spacing:-.01em;}
  .dots{display:flex;gap:7px;margin-left:auto;align-items:center;}
  .dots span{width:11px;height:11px;border-radius:50%;background:#dbe6ef;border:1px solid #cfdbe6;transition:.2s;}
  .dots span.done{background:var(--green2);border-color:var(--green2);}
  .dots span.current{background:var(--blue2);border-color:var(--blue2);box-shadow:0 0 0 4px rgba(26,126,196,.15);}

  .level-layout{display:grid;grid-template-columns:305px minmax(0,1fr) 300px;gap:16px;align-items:start;}
  @media (max-width:1160px){.level-layout{grid-template-columns:260px minmax(0,1fr);} .control-card{grid-column:1 / -1;}}
  @media (max-width:860px){.level-layout{grid-template-columns:1fr;} .control-card{grid-column:auto;}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 16px rgba(18,42,66,.045);}
  .guide-card{padding:18px 18px 16px;position:sticky;top:16px;}
  @media (max-width:1160px){.guide-card{position:static;}}
  .guide-setup{font-size:11px;color:#6d879c;background:#f5f9fc;border:1px solid #e0ebf3;border-radius:8px;padding:5px 9px;margin-bottom:12px;}
  .guide-goal{font-size:18px;line-height:1.45;font-weight:800;letter-spacing:-.01em;margin:0 0 14px;color:#0d3f66;}
  .guide-row{padding:9px 0;border-top:1px dashed #e7eef5;}
  .guide-row .label{display:block;font-size:10.5px;letter-spacing:.08em;color:#8aa2b6;font-weight:800;margin-bottom:2px;}
  .guide-row p{margin:0;font-size:12.5px;line-height:1.65;color:#365a75;}
  .guide-row.why p{color:#6d879c;font-size:12px;}
  .guide-row.mistake p{color:#8a5a2a;}

  .stage-card{overflow:hidden;}
  .stage-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfdff;flex-wrap:wrap;}
  .stage-badge{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#1a7ec4;background:#eaf5ff;border:1px solid #cfe6f6;border-radius:999px;padding:3px 9px;}
  .stage-setup{font-size:11.5px;color:#7d95aa;}
  .stage-wrap{position:relative;width:100%;aspect-ratio:4/3;background:
    radial-gradient(700px 420px at 50% 0%,#ffffff 0%,rgba(255,255,255,0) 65%),
    linear-gradient(#e9eef3,#dfe7ee);
    touch-action:none;overflow:hidden;
  }
  #stageSvg{display:block;width:100%;height:100%;user-select:none;}
  .stage-hint{
    position:absolute;left:14px;bottom:14px;max-width:82%;background:rgba(8,26,40,.9);color:#eaf6ff;
    font-size:12px;line-height:1.5;padding:8px 12px;border-radius:9px;border:1px solid #2f5a7a;
    opacity:0;transform:translateY(6px);transition:.18s;pointer-events:none;
  }
  .stage-hint.on{opacity:1;transform:none;}
  .hud{display:flex;flex-wrap:wrap;gap:7px;padding:10px 13px;border-top:1px solid var(--line);background:#fbfdff;}
  .chip{font-size:11.5px;border-radius:999px;padding:3px 9px;border:1px solid #d8e4ef;background:#f4f9fd;color:#3c6785;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .chip.ok{border-color:#bfe3cf;background:#f0fbf5;color:#1a6b4c;}
  .chip.bad{border-color:#f0d6c8;background:#fdf4ef;color:#9a4a22;}
  .chip.warn{border-color:#eeddbd;background:#fdf8ee;color:#8a6212;}
  .chip b{color:inherit;}

  .control-card{padding:16px;position:sticky;top:16px;}
  @media (max-width:1160px){.control-card{position:static;}}
  .control-title{font-size:14px;font-weight:800;color:#123c5c;margin:0 0 8px;letter-spacing:.01em;}
  .control-note{font-size:11.5px;color:#7d95aa;line-height:1.6;margin-top:10px;}
  .control-note b{color:#365a75;}
  .inline-error{background:#fdf1ee;border:1px solid #efc9bf;color:#8a2f22;border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.5;margin-top:11px;}
  .primary-btn{
    width:100%;border:0;border-radius:11px;padding:12px 14px;font-size:14px;font-weight:800;color:#fff;
    background:linear-gradient(160deg,#1a7ec4,#0b3f6b);cursor:pointer;transition:.15s;
    box-shadow:0 8px 18px rgba(15,92,156,.18);
  }
  .primary-btn:hover{background:linear-gradient(160deg,#2189cf,#0a3f6d);}
  .primary-btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;}
  .secondary-btn{
    width:100%;border:1px solid #cfe0ee;border-radius:11px;padding:11px 14px;font-size:13.5px;font-weight:800;
    color:#1d4d72;background:#fff;cursor:pointer;transition:.15s;margin-top:8px;
  }
  .secondary-btn:hover{background:#f4faff;border-color:#a9d3ee;}
  .secondary-btn:disabled{opacity:.38;cursor:not-allowed;}

  .gear-stack{display:grid;gap:8px;margin-top:10px;}
  .gear-action{
    border:1px solid #d8c37a;border-radius:11px;padding:11px 12px;font-size:13.5px;font-weight:800;
    color:#4a3500;background:linear-gradient(160deg,#fff2a8,#f2c211);cursor:pointer;transition:.15s;
    box-shadow:0 4px 0 #b58a04;
  }
  .gear-action:hover{filter:brightness(1.03);}
  .gear-action:active{transform:translateY(2px);box-shadow:0 2px 0 #b58a04;}
  .gear-action.two{background:linear-gradient(160deg,#ffe0a0,#e8a51c);border-color:#d5a24d;color:#4a3000;}
  .gear-action.zero{background:#fff;border-color:#cfe0ee;color:#365a75;box-shadow:none;font-weight:700;}
  .gear-action:disabled{opacity:.34;cursor:not-allowed;box-shadow:none;filter:grayscale(.35);}
  .gear-meter{display:flex;gap:6px;margin-top:10px;}
  .gear-meter span{flex:1;text-align:center;font-size:10.5px;font-weight:800;padding:4px 0;border-radius:7px;background:#f1f6fa;color:#9aafbe;border:1px solid #e4edf4;}
  .gear-meter span.on{background:#fff6d6;color:#7a5a00;border-color:#e6cf85;}

  .vol-readout{font-family:Consolas,monospace;font-size:38px;font-weight:800;color:#0d3f66;line-height:1;letter-spacing:-.02em;margin:8px 0 2px;}
  .vol-readout span{font-size:13px;color:#7d95aa;font-family:inherit;font-weight:600;margin-left:4px;}
  .vol-target{font-size:12px;color:var(--green);font-weight:800;margin-bottom:10px;}
  .nudge-row{display:flex;gap:8px;margin:10px 0 2px;}
  .nudge-row button{flex:1;border:1px solid #cfe0ee;background:#fff;border-radius:9px;padding:8px 0;font-size:13px;font-weight:800;color:#1d4d72;cursor:pointer;}
  .nudge-row button:hover{background:#f4faff;border-color:#a9d3ee;}

  .tilt-wrap{display:flex;align-items:center;gap:9px;margin:8px 0 4px;}
  .tilt-wrap input[type=range]{flex:1;accent-color:#1a7ec4;}
  .tilt-val{font-size:13px;font-weight:800;color:#2a5578;min-width:44px;text-align:right;font-variant-numeric:tabular-nums;}
  .tilt-sub{font-size:11px;color:#8aa2b6;margin-bottom:2px;}

  .substeps{display:flex;gap:6px;margin:10px 0 2px;}
  .substeps span{flex:1;text-align:center;font-size:10.5px;font-weight:800;padding:5px 0;border-radius:7px;background:#f1f6fa;color:#9aafbe;border:1px solid #e4edf4;}
  .substeps span.on{background:#eaf5ff;color:#0f5c9c;border-color:#c4e0f4;}

  .kbd-note{font-size:11px;color:#8aa2b6;margin-top:10px;line-height:1.6;}

  /* ---------- 完成弹层 ---------- */
  .overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(10,28,44,.46);backdrop-filter:blur(5px);padding:20px;}
  .complete-card{
    width:min(430px,100%);background:#fff;border:1px solid #d7e6f1;border-radius:24px;padding:30px 28px 24px;
    text-align:center;box-shadow:0 30px 80px rgba(8,30,48,.30);animation:pop .28s ease both;
  }
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
  .complete-check{
    width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
    background:linear-gradient(160deg,#e9fbf1,#c9f0dd);color:#15805a;font-size:34px;font-weight:900;
    border:1px solid #bfe3cf;
  }
  .complete-card h2{font-size:23px;margin:0 0 6px;letter-spacing:-.01em;}
  .complete-card p{font-size:13px;color:#5f7a90;margin:0 0 18px;line-height:1.65;}
  .complete-card .primary-btn{max-width:260px;margin:0 auto;}
  .auto-note{font-size:10.5px;color:#9aafbe;margin-top:10px;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);z-index:120;
    background:rgba(8,26,40,.94);color:#eaf6ff;font-size:12.5px;line-height:1.5;padding:9px 15px;border-radius:10px;
    border:1px solid #2f5a7a;opacity:0;pointer-events:none;transition:.22s;max-width:86vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}

  @media (max-width:640px){
    .app{padding:14px 12px 24px;}
    .map-hero{padding:20px;flex-direction:column;align-items:stretch;}
    .map-hero h1{font-size:30px;}
    .progress-box{min-width:0;}
    .level-head h2{font-size:22px;}
    .level-head-main{width:100%;}
    .dots{margin-left:0;}
    .guide-card{padding:15px;}
    .stage-wrap{aspect-ratio:1/1;}
    .control-card{padding:14px;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ================= 关卡地图 ================= -->
  <section id="mapView" class="view">
    <header class="map-hero">
      <div>
        <p class="eyebrow">PIPETTE TRAINING · 7 LEVELS</p>
        <h1>移液器闯关</h1>
        <p class="sub">每一关只练一个动作。做完本关就回到这里，下一关自动解锁。七关走完，就是一次完整的 150.0 µL 移液。</p>
      </div>
      <div class="progress-box">
        <div class="progress-top">
          <div class="progress-num"><span id="clearedCount">0</span><span>/ 7</span></div>
          <div class="status" id="progressBadge">准备开始</div>
        </div>
        <div class="progress-bar"><div id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">从第 1 关开始</div>
      </div>
    </header>

    <div id="allClear" class="all-clear hidden">
      <span style="font-size:22px">🎉</span>
      <div><b>七关全部通关</b><br><span>你已经走完装吸头 → 调体积 → 预润洗 → 吸液 → 排液 → 退吸头 → 收尾。</span></div>
    </div>

    <div id="levelGrid" class="level-grid" aria-label="七关地图"></div>

    <footer class="map-foot">
      <span>每关只显示本关需要的模型、操作和指引；完成后自动回到这张地图。</span>
      <button id="resetProgress" class="link-btn" type="button">重置进度</button>
    </footer>
  </section>

  <!-- ================= 单关页面 ================= -->
  <section id="levelView" class="view hidden">
    <header class="level-head">
      <button id="backBtn" class="ghost-btn" type="button">← 返回关卡地图</button>
      <div class="level-head-main">
        <span class="level-kicker">LEVEL <span id="levelNum">1</span> / 7</span>
        <h2 id="levelTitle">装吸头</h2>
      </div>
      <div class="dots" id="levelDots" aria-label="关卡进度"></div>
    </header>

    <div class="level-layout">
      <aside class="panel guide-card" id="guideCard"></aside>

      <main class="panel stage-card">
        <div class="stage-top">
          <span class="stage-badge">本关只练这一步</span>
          <span class="stage-setup" id="stageSetup"></span>
        </div>
        <div class="stage-wrap">
          <svg id="stageSvg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-label="本关操作场景"></svg>
          <div class="stage-hint" id="stageHint"></div>
        </div>
        <div class="hud" id="hud"></div>
      </main>

      <aside class="panel control-card">
        <div id="controlCard"></div>
        <div class="inline-error hidden" id="inlineError"></div>
      </aside>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="overlay hidden" id="completeOverlay">
  <div class="complete-card">
    <div class="complete-check">✓</div>
    <h2 id="completeTitle">第 1 关完成</h2>
    <p id="completeMsg"></p>
    <button id="completeBack" class="primary-btn" type="button">返回主页面</button>
    <div class="auto-note">1.6 秒后自动返回关卡地图</div>
  </div>
</div>

<script>
/* ============================================================
   移液器闯关 · 7 关
   - 主页面：7 关地图，顺序解锁
   - 每关：只显示本关的模型、操作和指引
   - 通关：自动回地图，解锁下一关
   - 单文件、零依赖、file:// 直接打开
   ============================================================ */

const $ = s => document.querySelector(s);
const K = 302 / 1033;            // 抠图总高 1033 -> 302 场景单位
const PX_PER_MM = 3.6;

const BOX   = { x0: 92, x1: 232, y: 372 };
const SRC   = { cx: 350, w: 46, mouth: 330, bottom: 470 };
const DST   = { cx: 646, w: 46, mouth: 330, bottom: 470 };
const WASTE = { x0: 818, x1: 922, y: 320 };
const HOME  = { x0: 640, x1: 820, y0: 300, y1: 468 };

const LEVELS = [
  {
    n: 1, key: "tip", title: "装吸头", tag: "TIP",
    desc: "把吸头装到枪上，并轻压确认密合。",
    setup: "本关起点：空枪 · 吸头盒",
    goal: "给移液器装一个密封的吸头。",
    action: "把吸头尖端移到盒口高亮处 → 点“压入吸头” → 点“轻压确认密合”。",
    success: "吸头已装，且密合确认完成。",
    mistake: "离盒口太远 / 只压入没确认。",
    why: "吸头不密封，吸液会漏气、体积会偏小。"

/* ---------------- 进度存储 ---------------- */
const STORE_KEY = "pipette-trainer-7levels-v1";
let progress = loadProgress();
let session = null;
let currentLevel = null;
let completeTimer = null;
let lastComplete = null;   // { n, wasReplay }

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { cleared: [] };
    const p = JSON.parse(raw);
    return { cleared: normalizeCleared(Array.isArray(p.cleared) ? p.cleared : []) };
  } catch (e) {
    return { cleared: [] };
  }
}
function normalizeCleared(arr) {
  const out = [];
  for (let n = 1; n <= 7; n++) {
    if (arr.includes(n)) out.push(n);
    else break;
  }
  return out;
}
function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {}
}
function maxUnlocked() {
  return Math.min(7, progress.cleared.length + 1);
}
function isCleared(n) { return progress.cleared.includes(n); }
function isUnlocked(n) { return n <= maxUnlocked(); }

}))).then(results => {

});

/* ---------------- 小工具 ---------------- */
function surfaceY(t, vol) {
  const usable = t.bottom - t.mouth - 24;
  return t.bottom - Math.max(0.02, vol / 1000) * usable;
}
function depthMM(t, y, vol) {
  return (y - surfaceY(t, vol)) / PX_PER_MM;
}
function wallDist(t, x) {
  return Math.min(x - (t.cx - t.w / 2), (t.cx + t.w / 2) - x);
}
function inTube(t, x, y) {
  return x > t.cx - t.w / 2 + 2 && x < t.cx + t.w / 2 - 2 && y > t.mouth && y < t.bottom;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function setError(msg) {
  const el = $("#inlineError");
  if (!el) return;
  el.textContent = msg;
  el.classList.remove("hidden");
}
function clearError() {
  const el = $("#inlineError");
  if (el) el.classList.add("hidden");
}
let hintTimer = null;
function stageHint(msg) {
  const el = $("#stageHint");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => el.classList.remove("on"), 3200);
}
let toastTimer = null;
function showToast(msg) {
  const el = $("#toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2800);
}

/* ---------------- 地图 ---------------- */
function renderMap(justCleared) {
  const max = maxUnlocked();
  const clearedCount = progress.cleared.length;
  const all = clearedCount === 7;

  $("#clearedCount").textContent = clearedCount;
  $("#progressFill").style.width = (clearedCount / 7 * 100) + "%";
  $("#progressBadge").textContent = all ? "全部通关" : clearedCount ? "进行中" : "准备开始";
  $("#progressBadge").style.cssText = all
    ? "background:#e9f8f1;border-color:#c4e8d7;color:#14664b;"
    : "";
  $("#progressLabel").textContent = all
    ? "七关已完成，可以随时重玩任意一关。"
    : `下一关：第 ${max} 关 · ${LEVELS[max - 1].title}`;
  $("#allClear").classList.toggle("hidden", !all);

  $("#levelGrid").innerHTML = LEVELS.map(L => {
    const cleared = isCleared(L.n);
    const unlocked = isUnlocked(L.n);
    const current = !cleared && L.n === max;
    const cls = ["level-card", cleared ? "cleared" : "", unlocked ? "unlocked" : "locked", current ? "current" : ""].join(" ");
    const status = cleared ? "已通关" : current ? "开始挑战" : unlocked ? "可挑战" : "未解锁";
    const foot = cleared ? "✓ 完成" : unlocked ? (current ? "进入 →" : "进入 →") : "🔒 锁定";
    return `<article class="${cls}" data-level="${L.n}" ${unlocked ? 'tabindex="0" role="button"' : 'aria-disabled="true"'}>
      <div class="card-top"><span class="num">STEP ${String(L.n).padStart(2, "0")}</span><span class="status">${status}</span></div>
      <h3>${L.title}</h3>
      <p>${L.desc}</p>
      <div class="card-foot"><span>${L.tag}</span><span class="go">${foot}</span></div>
    </article>`;
  }).join("");

  if (justCleared) {
    if (all) showToast("七关全部通关 🎉");
    else if (lastComplete && lastComplete.wasReplay) showToast(`第 ${justCleared} 关复习完成`);
    else showToast(`第 ${justCleared} 关完成，第 ${justCleared + 1} 关已解锁`);
  }
}

$("#levelGrid").addEventListener("click", e => {
  const card = e.target.closest(".level-card");
  if (!card) return;
  const n = Number(card.dataset.level);
  if (!isUnlocked(n)) {
    showToast(`先完成第 ${n - 1} 关，才能挑战这一关`);
    return;
  }
  startLevel(n);
});
$("#levelGrid").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest(".level-card");
  if (!card) return;
  e.preventDefault();
  const n = Number(card.dataset.level);
  if (isUnlocked(n)) startLevel(n);
});

$("#resetProgress").addEventListener("click", () => {
  if (!confirm("确定清空七关进度？")) return;
  progress = { cleared: [] };
  saveProgress();
  renderMap();
  showToast("进度已重置，从第 1 关开始");
});

/* ---------------- 关卡切换 ---------------- */
async function startLevel(n) {
  if (!isUnlocked(n)) return;
  await pipReady;
  currentLevel = n;
  session = createSession(n);
  $("#mapView").classList.add("hidden");
  $("#levelView").classList.remove("hidden");
  $("#completeOverlay").classList.add("hidden");
  $("#toast").classList.remove("on");
  $("#stageHint").classList.remove("on");
  $("#levelNum").textContent = n;
  $("#levelTitle").textContent = LEVELS[n - 1].title;
  $("#stageSetup").textContent = LEVELS[n - 1].setup;
  renderDots();
  renderGuide(n);
  renderControls(n);
  renderStage(n);
  clearError();
  updateAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderDots() {
  $("#levelDots").innerHTML = LEVELS.map(L => {
    const cls = L.n === currentLevel ? "current" : isCleared(L.n) ? "done" : "";
    return `<span class="${cls}" title="第 ${L.n} 关 ${L.title}"></span>`;
  }).join("");
}

function renderGuide(n) {
  const L = LEVELS[n - 1];
  $("#guideCard").innerHTML = `
    <div class="guide-setup">${L.setup}</div>
    <p class="guide-goal">${L.goal}</p>
    <div class="guide-row"><span class="label">只做这一件事</span><p>${L.action}</p></div>
    <div class="guide-row"><span class="label">成功条件</span><p>${L.success}</p></div>
    <div class="guide-row mistake"><span class="label">常见错误</span><p>${L.mistake}</p></div>
    <div class="guide-row why"><span class="label">为什么</span><p>${L.why}</p></div>
  `;
}

function createSession(n) {
  const s = {
    n, x: 0, y: 0, scale: 0.55, tilt: 0, gear: 0,
    tip: false, tipOk: false, tipVol: 0,
    vol: 200, srcVol: 900, dstVol: 0,
    rinsed: 0, rinseStep: 0, armed: false,
    stage1: false, stage2: false, done: false
  };
  if (n === 1) { s.x = 174; s.y = 300; s.scale = 0.60; }
  if (n === 2) { s.vol = 200; }
  if (n === 3) { s.x = 350; s.y = 340; s.tip = true; s.vol = 150; s.tipVol = 0; s.srcVol = 900; }
  if (n === 4) { s.x = 350; s.y = 340; s.tip = true; s.vol = 150; s.tipVol = 0; s.srcVol = 900; }
  if (n === 5) { s.x = 646; s.y = 340; s.tip = true; s.tipVol = 150; s.dstVol = 0; }
  if (n === 6) { s.x = 760; s.y = 300; s.tip = true; s.tipVol = 0; }
  if (n === 7) { s.x = 500; s.y = 350; s.tip = false; }
  return s;
}

  }).join("");
  return `<g id="depthGuide">
    <rect x="382" y="${y2.toFixed(1)}" width="30" height="${(y5 - y2).toFixed(1)}" fill="rgba(31,158,116,.16)" stroke="#1f9e74" stroke-width="1" stroke-dasharray="3 3"/>

    </g>` : ""}
  </g>`;
}

function bindGearButtons() {
  const g1 = $("#gear1"), g2 = $("#gear2"), g0 = $("#gear0");
  if (g1) g1.addEventListener("click", () => setGear(1));
  if (g2) g2.addEventListener("click", () => setGear(2));
  if (g0) g0.addEventListener("click", () => setGear(0));
}

/* ---------------- 拖动 ---------------- */
function bindDrag(n) {
  const svg = $("#stageSvg");
  const pip = $("#pip");
  if (!pip) return;
  let grab = null;
  const toScene = (clientX, clientY) => {
    const p = svg.createSVGPoint();
    p.x = clientX; p.y = clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  };
  pip.addEventListener("pointerdown", e => {
    e.preventDefault();
    const p = toScene(e.clientX, e.clientY);
    grab = { dx: session.x - p.x, dy: session.y - p.y };
    try { pip.setPointerCapture(e.pointerId); } catch (err) {}
    pip.style.cursor = "grabbing";
  });
  pip.addEventListener("pointermove", e => {
    if (!grab) return;
    const p = toScene(e.clientX, e.clientY);
    moveTo(p.x + grab.dx, p.y + grab.dy);
  });
  const up = e => {
    if (!grab) return;
    grab = null;
    pip.style.cursor = "grab";
    try { pip.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  pip.addEventListener("pointerup", up);
  pip.addEventListener("pointercancel", up);
}

function moveTo(x, y) {
  if (!session) return;
  const s = session;
  if (s.n === 1) { s.x = clamp(x, 60, 260); s.y = clamp(y, 260, 450); }
  else if (s.n === 3 || s.n === 4) { s.x = clamp(x, 300, 400); s.y = clamp(y, 330, 450); }
  else if (s.n === 5) { s.x = clamp(x, 600, 690); s.y = clamp(y, 330, 460); }
  else if (s.n === 6) { s.x = clamp(x, 700, 980); s.y = clamp(y, 240, 440); }
  else if (s.n === 7) { s.x = clamp(x, 400, 950); s.y = clamp(y, 250, 520); }
  else { s.x = x; s.y = y; }
  updateAll();
}

/* ---------------- 体积累积 ---------------- */
function bindDial() {
  const ring = $("#volRingSvg");
  if (!ring) return;
  let drag = null;
  ring.addEventListener("pointerdown", e => {
    e.preventDefault();
    drag = { y: e.clientY, v: session.vol };
    try { ring.setPointerCapture(e.pointerId); } catch (err) {}
  });
  ring.addEventListener("pointermove", e => {
    if (!drag) return;
    setVolume(drag.v + (drag.y - e.clientY) * 0.7);
  });
  const up = e => {
    drag = null;
    try { ring.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  ring.addEventListener("pointerup", up);
  ring.addEventListener("pointercancel", up);
}

function setVolume(v) {
  if (!session || session.done) return;
  const s = session;
  s.vol = Math.round(clamp(v, 20, 200) * 10) / 10;
  const ring = $("#volRingSvg");
  if (ring) ring.setAttribute("transform", `translate(300,${yForVol(s.vol)})`);
  const readout = $("#dialReadout");
  if (readout) readout.textContent = s.vol.toFixed(1);
  const value = $("#volValue");
  if (value) value.textContent = s.vol.toFixed(1);
  clearError();
  if (Math.abs(s.vol - 150) < 0.05) {
    stageHint("体积已到 150.0 µL");
    completeLevel();
  } else {
    stageHint(`当前 ${s.vol.toFixed(1)} µL，目标 150.0 µL`);
  }
  updateHUD();
}

/* ---------------- 挡位 ---------------- */
function setGear(g) {
  if (!session || session.done) return;
  const s = session;

  if (s.n === 3 || s.n === 4) {
    if (g === s.gear) return;
    if (g === 1) {
      if (s.tipVol > 0) {
        const d = depthMM(SRC, s.y, s.srcVol);
        if (!inTube(SRC, s.x, s.y) || d <= 0) {
          s.gear = 0;
          setError("把吸头降到液面下，再点“按下一档”回打。");
          updateAll();
          return;
        }
        // 润洗回打：按一档立即把液体打回原管
        s.srcVol = Math.min(900, s.srcVol + s.tipVol);
        s.tipVol = 0;
        s.rinsed = 1;
        s.gear = 1;
        clearError();
        stageHint("润洗 1 次完成：液体已回到 21 管");
        updateAll();
        completeLevel();
        return;
      }
      if (inTube(SRC, s.x, s.y) && depthMM(SRC, s.y, s.srcVol) > 0) {
        s.gear = 0;
        s.armed = false;
        setError("先抬出液面，按一档，再入液。");
        updateAll();
        return;
      }
      s.gear = 1;
      s.armed = true;
      clearError();
      stageHint("一档已按下：把吸头移入液面 2–5 mm，再点“松手复位”。");
      updateAll();
      return;
    }
    if (g === 0) {
      if (s.armed) {
        const d = depthMM(SRC, s.y, s.srcVol);
        const w = wallDist(SRC, s.x);
        if (!inTube(SRC, s.x, s.y)) {
          setError("把吸头放进 21 管里再松手。");
          s.armed = false; s.gear = 0; updateAll(); return;
        }
        if (d < 2) {
          setError(`浸入太浅（${d.toFixed(1)} mm），会吸进空气。`);
          s.armed = false; s.gear = 0; updateAll(); return;
        }
        if (d > 5) {
          setError(`插太深（${d.toFixed(1)} mm），外壁会沾液。`);
          s.armed = false; s.gear = 0; updateAll(); return;
        }
        if (w < 5) {
          setError("吸头蹭到管壁了，往中间挪一点。");
          s.armed = false; s.gear = 0; updateAll(); return;
        }
        s.tipVol = 150;
        s.srcVol = 750;
        s.rinseStep = 1;
        s.armed = false;
        s.gear = 0;
        clearError();
        if (s.n === 3) {
          stageHint("吸液完成。下一步：在液面下点“按下一档”，把液体回打。");
          updateAll();
        } else {
          stageHint("吸液完成：150.0 µL");
          updateAll();
          completeLevel();
        }
        return;
      }
      s.gear = 0;
      updateAll();
      return;
    }
    return;
  }

  if (s.n === 5) {
    if (g === s.gear) return;
    if (g === 1) {
      if (!inTube(DST, s.x, s.y)) {
        setError("先把吸头移到 PCR 5 管内。");
        s.gear = 0; updateAll(); return;
      }
      if (s.tipVol <= 0) {
        setError("吸头里没有液体。");
        s.gear = 0; updateAll(); return;
      }
      const w = wallDist(DST, s.x);
      if (w > 6) {
        setError(`贴住右壁再排液（现在离壁 ${Math.round(w)} px）。`);
        s.gear = 0; updateAll(); return;
      }
      if (Math.abs(s.tilt) < 12 || Math.abs(s.tilt) > 45) {
        setError(`把倾角调到 30° 左右（现在 ${s.tilt}°）。`);
        s.gear = 0; updateAll(); return;
      }
      const out = Math.max(0, s.tipVol - 2);
      s.dstVol += out;
      s.tipVol = Math.max(0, s.tipVol - out);
      s.stage1 = true;
      s.gear = 1;
      clearError();
      stageHint("一档排液完成。点“按到二档”吹出残液。");
      updateAll();
      return;
    }
    if (g === 2) {
      if (!s.stage1) {
        setError("先完成一档排液，再按二档。");
        return;
      }
      if (!inTube(DST, s.x, s.y)) {
        setError("二档要在目标管内吹。");
        return;
      }
      s.dstVol += s.tipVol;
      s.tipVol = 0;
      s.stage2 = true;
      s.gear = 2;
      clearError();
      stageHint("二档吹出完成。点“松手复位”结束本关。");
      updateAll();
      return;
    }
    if (g === 0) {
      if (s.stage1 && !s.stage2) {
        setError("还差二档：先点“按到二档”，再松手。");
        return;
      }
      if (s.stage2) {
        s.gear = 0;
        updateAll();
        completeLevel();
        return;
      }
      s.gear = 0;
      updateAll();
      return;
    }
  }
}

function setTilt(v) {
  if (!session) return;
  session.tilt = clamp(Math.round(v), 0, 45);
  const el = $("#tiltValue");
  if (el) el.textContent = session.tilt + "°";
  const range = $("#tiltRange");
  if (range) range.value = session.tilt;
  updateAll();
}

/* ---------------- 动作 ---------------- */
function overTipBox() {
  const s = session;
  return s && s.x > BOX.x0 && s.x < BOX.x1 && s.y > 328 && s.y < 416;
}
function attachTip() {
  const s = session;
  if (!s || s.n !== 1 || s.tip) return;
  if (!overTipBox()) {
    setError("再靠近盒口一点：把吸头尖端移到绿色高亮区。");
    return;
  }
  s.tip = true;
  s.tipOk = false;
  s.x = 174; s.y = 372;
  clearError();
  stageHint("咔哒 —— 吸头已装上，点“轻压确认密合”。");
  updateAll();
}
function confirmTip() {
  const s = session;
  if (!s || s.n !== 1 || !s.tip || s.tipOk) return;
  s.tipOk = true;
  clearError();
  stageHint("密合确认完成");
  updateAll();
  completeLevel();
}
function tryEject() {
  const s = session;
  if (!s || s.n !== 6) return;
  if (!s.tip) { setError("已经没有吸头了。"); return; }
  if (s.tipVol >= 0.5) { setError("先排空吸头，不能带液退。"); return; }
  if (!overWaste()) { setError("再对准桶口：把吸头移到绿色虚线区。"); return; }
  s.tip = false;
  s.tipVol = 0;
  clearError();
  stageHint("吸头落入废液桶");
  updateAll();
  completeLevel();
}
function confirmHome() {
  const s = session;
  if (!s || s.n !== 7) return;
  if (s.tip) { setError("先退掉吸头，再归位。"); return; }
  if (!inHome()) { setError("把移液器移到右侧绿色归位区。"); return; }
  clearError();
  stageHint("归位完成");
  updateAll();
  completeLevel();
}
function overWaste() {
  const s = session;
  return s && s.x > 808 && s.x < 932 && s.y > 260 && s.y < 390;
}
function inHome() {
  const s = session;
  return s && s.x > HOME.x0 && s.x < HOME.x1 && s.y > HOME.y0 && s.y < HOME.y1;
}

/* ---------------- 渲染更新 ---------------- */
function updateAll() {
  if (!session) return;
  updatePip();
  updateHUD();
  updateGearUI();
  if (session.n === 3 || session.n === 4) updateSourceVisuals();
  if (session.n === 5) updateTargetVisuals();
  if (session.n === 6) updateWasteVisuals();
  if (session.n === 7) updateHomeVisuals();
  if (session.n === 1) updateTipBoxVisuals();
}

function updatePip() {
  const s = session;
  const pip = $("#pip");
  if (!pip || !s) return;
  pip.setAttribute("transform", `translate(${s.x},${s.y}) rotate(${s.tilt}) scale(${s.scale})`);
  const tip = $("#gTip");
  if (tip) tip.style.display = s.tip ? "" : "none";
  const liq = $("#tipLiq");
  if (liq) {
    const h = s.tipVol <= 0 ? 0 : Math.min(56, 5 + s.tipVol / 200 * 52);
    liq.setAttribute("height", h.toFixed(1));
    liq.setAttribute("y", (-6 - h).toFixed(1));
  }
  const sink = s.gear === 2 ? 48 : s.gear === 1 ? 34 : 0;
  const cap = $("#capImg");
  if (cap) cap.setAttribute("y", sink);
  const vecCap = $("#vecCap");
  if (vecCap) vecCap.setAttribute("transform", `translate(0,${sink * K})`);
}

function chip(label, value, kind) {
  return `<span class="chip ${kind || ""}">${label}：<b>${value}</b></span>`;
}

function updateHUD() {
  const s = session;
  if (!s) return;
  let html = "";
  if (s.n === 1) {
    html += chip("吸头", s.tip ? (s.tipOk ? "已装 · 已确认" : "已装 · 待确认") : "未装", s.tip ? (s.tipOk ? "ok" : "warn") : "bad");
    html += chip("盒口", overTipBox() ? "对准" : "未对准", overTipBox() ? "ok" : "warn");
  } else if (s.n === 2) {
    html += chip("当前", s.vol.toFixed(1) + " µL", Math.abs(s.vol - 150) < 0.05 ? "ok" : "warn");
    html += chip("目标", "150.0 µL", "ok");
  } else if (s.n === 3) {
    const d = depthMM(SRC, s.y, s.srcVol);
    const dText = d < 0 ? `液面上方 ${Math.abs(d).toFixed(1)} mm` : `${d.toFixed(1)} mm`;
    html += chip("吸头", s.tipVol.toFixed(0) + " µL", s.tipVol > 0 ? "ok" : "");
    html += chip("深度", dText, d >= 2 && d <= 5 ? "ok" : "warn");
    html += chip("润洗", s.rinsed ? "1 / 1" : "0 / 1", s.rinsed ? "ok" : "");
  } else if (s.n === 4) {
    const d = depthMM(SRC, s.y, s.srcVol);
    const w = wallDist(SRC, s.x);
    const dText = d < 0 ? `液面上方 ${Math.abs(d).toFixed(1)} mm` : `${d.toFixed(1)} mm`;
    html += chip("深度", dText, d >= 2 && d <= 5 ? "ok" : "warn");
    html += chip("离壁", Math.round(w) + " px", w >= 5 ? "ok" : "bad");
    html += chip("吸头", s.tipVol.toFixed(0) + " µL", s.tipVol > 0 ? "ok" : "");
  } else if (s.n === 5) {
    const w = wallDist(DST, s.x);
    html += chip("倾角", s.tilt + "°", s.tilt >= 12 && s.tilt <= 45 ? "ok" : "warn");
    html += chip("离壁", Math.round(w) + " px", w <= 6 ? "ok" : "bad");
    html += chip("目标", s.dstVol.toFixed(0) + " µL", s.dstVol === 150 ? "ok" : "");
    html += chip("吸头", s.tipVol.toFixed(0) + " µL", s.tipVol > 0 ? "ok" : "");
  } else if (s.n === 6) {
    html += chip("吸头", s.tip ? (s.tipVol > 0 ? s.tipVol.toFixed(0) + " µL" : "已空") : "已退", s.tip ? (s.tipVol > 0 ? "bad" : "ok") : "ok");
    html += chip("桶口", overWaste() ? "对准" : "未对准", overWaste() ? "ok" : "warn");
  } else if (s.n === 7) {
    html += chip("吸头", s.tip ? "未退" : "已脱", s.tip ? "bad" : "ok");
    html += chip("位置", inHome() ? "归位区" : "台面上", inHome() ? "ok" : "warn");
  }
  $("#hud").innerHTML = html;
}

function updateGearUI() {
  const s = session;
  if (!s) return;
  const g1 = $("#gear1"), g2 = $("#gear2"), g0 = $("#gear0");
  if (!g1 || !g0) return;
  g1.disabled = s.gear !== 0;
  g0.disabled = s.gear === 0;
  if (g2) g2.disabled = s.gear !== 1 || !s.stage1;
  const meter = document.querySelectorAll(".gear-meter span");
  meter.forEach(el => el.classList.toggle("on", Number(el.dataset.g) === s.gear));
  const sub1 = $("#sub1"), sub2 = $("#sub2");
  if (sub1) sub1.classList.toggle("on", s.rinseStep === 0);
  if (sub2) sub2.classList.toggle("on", s.rinseStep >= 1);
}

function updateSourceVisuals() {
  const s = session;
  if (!s) return;
  const sy = surfaceY(SRC, s.srcVol);
  const liq = document.querySelector("#stageSvg .liq");
  if (liq) {
    const bottomY = SRC.bottom - 34;
    liq.setAttribute("d", `M${SRC.cx - 22} ${sy.toFixed(1)} h44 v${(bottomY - sy).toFixed(1)} l-22 34 -22 -34 z`);
  }
  const guide = $("#depthGuideWrap");
  if (guide) guide.innerHTML = sourceGuides(s.n === 4);
}

function updateTargetVisuals() {
  const s = session;
  if (!s) return;
  const sy = surfaceY(DST, s.dstVol);
  const liq = document.querySelector("#stageSvg .liq");
  if (liq) {
    const bottomY = 468;
    if (sy < bottomY) liq.setAttribute("d", `M${DST.cx - 22} ${sy.toFixed(1)} h44 v${(bottomY - sy).toFixed(1)} l-22 16 -22 -16 z`);
    else liq.setAttribute("d", "");
  }
  const wall = $("#dstWall");
  if (wall) {
    const near = wallDist(DST, s.x) <= 6;
    wall.setAttribute("fill", near ? "rgba(31,158,116,.25)" : "rgba(31,158,116,0)");
  }
  const needle = $("#angleNeedle");
  if (needle) needle.setAttribute("transform", `rotate(${s.tilt})`);
}

function updateWasteVisuals() {
  const s = session;
  const hit = $("#wasteHit");
  if (hit) hit.setAttribute("opacity", overWaste() ? "1" : "0");
  const btn = $("#ejectBtn");
  if (btn) btn.disabled = !(s && s.tip && s.tipVol < 0.5 && overWaste());
}

function updateHomeVisuals() {
  const s = session;
  const home = $("#home");
  if (home) home.setAttribute("opacity", inHome() ? "1" : ".78");
  const btn = $("#homeBtn");
  if (btn) btn.disabled = !(s && !s.tip && inHome());
}

function updateTipBoxVisuals() {
  const s = session;
  const hl = $("#boxHighlight");
  if (hl) hl.setAttribute("opacity", overTipBox() ? "1" : ".55");
  const attach = $("#attachBtn");
  if (attach) attach.disabled = !(s && !s.tip && overTipBox());
  const confirm = $("#confirmBtn");
  if (confirm) confirm.classList.toggle("hidden", !(s && s.tip && !s.tipOk));
}

/* ---------------- 通关 ---------------- */
function completeLevel() {
  const s = session;
  if (!s || s.done) return;
  s.done = true;
  const n = s.n;
  const wasReplay = isCleared(n);
  lastComplete = { n, wasReplay };
  if (!wasReplay) {
    progress.cleared.push(n);
    progress.cleared = normalizeCleared(progress.cleared);
    saveProgress();
  }
  const overlay = $("#completeOverlay");
  const all = progress.cleared.length === 7;
  $("#completeTitle").textContent = wasReplay ? `第 ${n} 关复习完成` : `第 ${n} 关完成`;
  if (wasReplay) {
    $("#completeMsg").textContent = "这一关已经通关，可以继续挑战后面的关卡。";
  } else if (all) {
    $("#completeMsg").textContent = "七关全部通关：你已经走完装吸头 → 调体积 → 预润洗 → 吸液 → 排液 → 退吸头 → 收尾。";
  } else {
    const next = LEVELS[n];
    $("#completeMsg").textContent = `第 ${n + 1} 关已解锁：${next.title}。回到主页面继续。`;
  }
  overlay.classList.remove("hidden");
  clearTimeout(completeTimer);
  completeTimer = setTimeout(() => returnToMap(n), 1600);
}

$("#completeBack").addEventListener("click", () => {
  clearTimeout(completeTimer);
  if (lastComplete) returnToMap(lastComplete.n);
});

function returnToMap(justCleared) {
  clearTimeout(completeTimer);
  $("#completeOverlay").classList.add("hidden");
  $("#levelView").classList.add("hidden");
  $("#mapView").classList.remove("hidden");
  session = null;
  currentLevel = null;
  renderMap(justCleared || null);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("#backBtn").addEventListener("click", () => {
  clearTimeout(completeTimer);
  $("#completeOverlay").classList.add("hidden");
  $("#levelView").classList.add("hidden");
  $("#mapView").classList.remove("hidden");
  session = null;
  currentLevel = null;
  renderMap();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ---------------- 启动 ---------------- */
renderMap();

/* 测试/调试钩子 */
window.GAME = {
  levels: LEVELS,
  get progress() { return progress; },
  get session() { return session; },
  startLevel,
  returnToMap,
  moveTo,
  setGear,
  setTilt,
  setVolume,
  attachTip,
  confirmTip,
  tryEject,
  confirmHome,
  completeLevel,
  resetProgress(silent) {
    progress = { cleared: [] };
    saveProgress();
    if (!silent) showToast("进度已重置");
    renderMap();
  },
  overTipBox,
  overWaste,
  inHome,
  depth() { return session ? depthMM(SRC, session.y, session.srcVol) : null; },
  wall() { return session ? wallDist(session.n === 5 ? DST : SRC, session.x) : null; },
  surfaceY
};
</script>
</body>
</html>
